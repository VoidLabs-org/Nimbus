spring.application.name=api

# Local settings and secrets from apps/api/.env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Database: DB_* from .env, or the local docker-compose database when unset.
# Tests use their own Testcontainers database and ignore these.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nimbus}
spring.datasource.username=${DB_USERNAME:nimbus}
spring.datasource.password=${DB_PASSWORD:nimbus}

# Sign-in: JWT_SECRET from .env is required (the app refuses to start without it).
# Tests generate their own random secret.
nimbus.auth.jwt-secret=${JWT_SECRET:}
# Two-step verification: TWO_STEP_SECRET from .env is required too. It encrypts authenticator keys, so everyone on
# one database must use the same value, and changing it means every User sets Two-step verification up again.
nimbus.auth.two-step-secret=${TWO_STEP_SECRET:}

# Rate limits key on the client's IP. Take it from X-Forwarded-For only when the request comes from a
# trusted proxy (Tomcat trusts private and loopback addresses), so internet clients can't fake it.
server.forward-headers-strategy=native

# Flyway owns the schema; Hibernate only checks that entities match it.
# Out of order: branches written in parallel number their migrations independently, so one can merge with a lower
# version than a database has already applied (V14 after V15). Without this such a database refuses to start;
# with it, Flyway applies the missing migration.
spring.flyway.out-of-order=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Modulith records asynchronous domain-event deliveries; resume unfinished listeners after a restart.
spring.modulith.events.republish-outstanding-events-on-restart=true

# First admin User, created at startup when both are set (see .env.example). Does nothing if that email exists.
nimbus.admin.email=${NIMBUS_ADMIN_EMAIL:}
nimbus.admin.password=${NIMBUS_ADMIN_PASSWORD:}

# "Continue with Google": off unless GOOGLE_CLIENT_ID is set (see .env.example). Provider tokens are never stored.
nimbus.auth.google.client-id=${GOOGLE_CLIENT_ID:}
nimbus.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# "Continue with GitHub": likewise off unless GITHUB_CLIENT_ID is set.
nimbus.auth.github.client-id=${GITHUB_CLIENT_ID:}
nimbus.auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Only the OAuth handshake uses an HTTP session; it is dropped when the handshake ends. Lax, so the cookie
# comes back with Google's redirect.
server.servlet.session.timeout=5m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# The origin browsers use to reach Nimbus (PUBLIC_URL in .env or the environment). Providers redirect back to it.
# In dev that is the Vite server, which proxies /api to this API.
nimbus.auth.public-url=${PUBLIC_URL:http://localhost:3000}

# Email goes through Brevo when BREVO_API_KEY is set (MAIL_FROM is then required); otherwise it is written to the log.
nimbus.mail.brevo-api-key=${BREVO_API_KEY:}
nimbus.mail.from=${MAIL_FROM:}
nimbus.mail.from-name=${MAIL_FROM_NAME:Nimbus}
# Public https address that serves the images in emails (the Nimbus logo). Blank: emails carry no images.
nimbus.mail.assets-url=${MAIL_ASSETS_URL:}

# Uploaded files (Profile pictures) go to the bucket through the S3 API: STORAGE_* from .env, or the local
# docker-compose MinIO when unset. The shared dev database uses the shared R2 bucket nimbus-dev (ask the team).
# Tests start their own MinIO and ignore these.
nimbus.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
nimbus.storage.region=${STORAGE_REGION:us-east-1}
nimbus.storage.bucket=${STORAGE_BUCKET:nimbus}
# The keys have no default: without them the API refuses to start, so a missing setting can't quietly send uploads
# to a MinIO that isn't there. .env.example has the local MinIO's.
nimbus.storage.access-key=${STORAGE_ACCESS_KEY:}
nimbus.storage.secret-key=${STORAGE_SECRET_KEY:}

# Uploads: a ceiling for every multipart endpoint. Each endpoint checks its own, lower limit (Profile pictures: 5 MB,
# code file_too_large); raise this when an endpoint needs more. Resolved lazily, so a refusal by the ceiling reaches
# the endpoint's module's error handling instead of failing before any controller is picked.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.resolve-lazily=true
# Tomcat closes the connection when more than this is left unread after refusing a request, and the client then
# sees a broken connection instead of the answer. 16 MB covers the files people pick by mistake (default 2 MB).
server.tomcat.max-swallow-size=16MB
# Where uploaded photos are served; the API itself, until a public bucket on our own domain serves them.
nimbus.profile-pictures.base-url=${PROFILE_PICTURES_URL:/api/profile-pictures}
