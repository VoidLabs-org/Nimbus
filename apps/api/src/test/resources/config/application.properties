# Test-only overrides (classpath:config/ wins over the main application.properties).
# The test suite registers and signs in many Users from 127.0.0.1; RateLimitTests sets its own lower limits.
nimbus.auth.registrations-per-address=1000
nimbus.auth.sign-ins-per-address=1000
nimbus.auth.refreshes-per-address=1000
nimbus.auth.password-reset-requests-per-address=1000
nimbus.auth.password-resets-per-address=1000
# Keep a developer's NIMBUS_ADMIN_* from seeding an admin in every test; AdminSeedTests sets its own.
nimbus.admin.email=
nimbus.admin.password=
# A made-up Google client, so the sign-in wiring is built in every test. Nothing here talks to Google.
nimbus.auth.google.client-id=test-google-client
nimbus.auth.google.client-secret=test-google-secret
# Likewise for GitHub.
nimbus.auth.github.client-id=test-github-client
nimbus.auth.github.client-secret=test-github-secret
