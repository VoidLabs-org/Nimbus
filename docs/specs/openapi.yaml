openapi: 3.1.0
info:
  title: Nimbus API
  version: 0.1.0
  description: "REST contract for Nimbus. Every endpoint needs a Bearer access token unless it says `security: []`."

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: auth
    description: Registration, sign-in and sessions (identity module)
  - name: users
    description: User profiles (identity module)

paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Register with email and password, and sign in straight away
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "409":
          description: The email is already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          description: Invalid email or password (the same for an unknown email, a wrong password and a User without a password)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/oauth2/google:
    get:
      tags: [auth]
      summary: Start "Continue with Google"
      description: >-
        Open it with a full page load (a link, not `fetch`): the browser is redirected to Google and back. The
        handshake keeps a short-lived HTTP session; nothing else in the API does. Only available when
        `GOOGLE_CLIENT_ID` is set.
      security: []
      responses:
        "302":
          description: Redirect to Google's sign-in page

  /api/auth/oauth2/callback/google:
    get:
      tags: [auth]
      summary: Where Google sends the browser back to (not called by the web app)
      description: >-
        Signs the User in or creates them, linking the Google login (see the identity module spec for the rules).
        On success it sets the refresh cookie and redirects to `/auth/callback` on the public URL (`PUBLIC_URL`), where the web app calls
        `POST /api/auth/refresh` for an access token; no token is ever in a URL. On failure it redirects to
        `/login?error=<code>&provider=google` on the public URL with `email_unverified` (Google did not verify the email),
        `cancelled` (the person declined at Google) or `failed` (anything else).
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of `code`, e.g. `access_denied`
          schema:
            type: string
      responses:
        "302":
          description: Redirect to `/auth/callback` (with the refresh cookie set) or to `/login?error=<code>`
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  /api/auth/oauth2/github:
    get:
      tags: [auth]
      summary: Start "Continue with GitHub"
      description: >-
        Open it with a full page load (a link, not `fetch`): the browser is redirected to GitHub and back. The
        handshake keeps a short-lived HTTP session; nothing else in the API does. Only available when
        `GITHUB_CLIENT_ID` is set.
      security: []
      responses:
        "302":
          description: Redirect to GitHub's sign-in page

  /api/auth/oauth2/callback/github:
    get:
      tags: [auth]
      summary: Where GitHub sends the browser back to (not called by the web app)
      description: >-
        Signs the User in or creates them, linking the GitHub login (see the identity module spec for the rules).
        On success it sets the refresh cookie and redirects to `/auth/callback` on the public URL (`PUBLIC_URL`), where the web app calls
        `POST /api/auth/refresh` for an access token; no token is ever in a URL. On failure it redirects to
        `/login?error=<code>&provider=github` on the public URL with `email_unverified` (the GitHub account has no verified primary email),
        `cancelled` (the person declined at GitHub) or `failed` (anything else).
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from GitHub
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by GitHub instead of `code`, e.g. `access_denied`
          schema:
            type: string
      responses:
        "302":
          description: Redirect to `/auth/callback` (with the refresh cookie set) or to `/login?error=<code>`
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renew the session from the refresh cookie and get a new access token
      description: >-
        Exchanges the refresh cookie for a new one (rotation). A refresh token works once: presenting a used one
        revokes its whole session.
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `nimbus`. Cross-site forms can't set it, so other sites can't use the cookie.
          schema:
            type: string
            const: nimbus
      responses:
        "200":
          description: Session renewed
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: The cookie is missing, unknown, expired, revoked or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The X-Requested-With header is missing or not `nimbus`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out of this browser
      description: >-
        Ends the session the refresh cookie belongs to, even if that token was already rotated, and clears the
        cookie. Other sessions of the same User are not affected. Succeeds with no cookie, an unknown cookie or
        a session that is already over.
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `nimbus`. Cross-site forms can't set it, so other sites can't sign a User out.
          schema:
            type: string
            const: nimbus
      responses:
        "204":
          description: Signed out; the refresh cookie is cleared (`Max-Age=0`)
          headers:
            Set-Cookie:
              description: "`refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=0`"
              schema:
                type: string
        "403":
          description: The X-Requested-With header is missing or not `nimbus`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/users/me:
    get:
      tags: [users]
      summary: The signed-in User
      responses:
        "200":
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      summary: Change the signed-in User's display name
      description: Only the display name can be changed here. Other properties in the body are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The updated User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/me/password:
    put:
      tags: [users]
      summary: Set or change the signed-in User's password
      description: >-
        A User without a password (they only sign in with Google or GitHub) sets one; `currentPassword` is ignored.
        A User with one must give it as `currentPassword`. The request must come from a session that is still
        running. Changing an existing password ends every other session of the User; setting a first one ends none. This
        browser stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is set
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token

  headers:
    RefreshCookie:
      description: >-
        Starts or rotates the session: `refresh_token=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/auth;
        Max-Age=<seconds until it expires>`. Expires 30 days after issue, and never later than 90 days after sign-in.
      schema:
        type: string

  schemas:
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Surrounding whitespace is removed; at least one visible character; at most 100 characters (an emoji counts as one); no control, line-separator or invisible format characters (zero-width space, word joiner, byte order mark, soft hyphen) and no bidirectional marks, overrides or isolates. U+200D and U+200C are allowed only between two visible characters (emoji sequences, Persian and Indic scripts)
        email:
          type: string
          format: email
          maxLength: 254
          description: Case-insensitive; stored lower-cased
        password:
          type: string
          minLength: 8
          maxLength: 128

    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Same rule as at registration. Surrounding whitespace is removed; at least one visible character; at most 100 characters (an emoji counts as one); no control, line-separator or invisible format characters (zero-width space, word joiner, byte order mark, soft hyphen) and no bidirectional marks, overrides or isolates. U+200D and U+200C are allowed only between two visible characters (emoji sequences, Persian and Indic scripts)

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: Required when the User has a password (`400` with `errors.currentPassword` if missing or wrong)
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Same rules as at registration; kept exactly as typed

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Case-insensitive
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: HS256 JWT, valid 15 minutes. Keep it in memory only.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required: [id, email, displayName, avatarUrl, hasPassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri
        hasPassword:
          type: boolean
          description: False for Users who only sign in with Google or GitHub; the app asks for a current password only when true

    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    InvalidFields:
      description: Some fields are invalid
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  errors:
                    type: object
                    description: Message per invalid field
                    additionalProperties:
                      type: string
    TooManyAttempts:
      description: Rate limited (failed sign-ins per email or IP address, registrations or refreshes per IP address, or wrong current passwords per User)
      headers:
        Retry-After:
          description: Seconds until another attempt may succeed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, expired or invalid access token
