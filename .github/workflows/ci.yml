name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or PR cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Job names are the required checks in the "Protect main" ruleset. Keep them stable;
# renaming one means updating the ruleset in the same change.
jobs:
  # Format, lint, types, tests and build for everything except the API.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs pnpm (version from package.json) and Node.js, then runs pnpm install.
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      - run: pnpm format:check

      # The API is checked by the backend job with Gradle.
      - run: pnpm exec turbo run lint check-types test build --filter=!api

  # Build, tests (Testcontainers Postgres) and Modulith verification for the API.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # Compiles, runs all tests (Modulith verification, Testcontainers Postgres) and builds the jar.
      - run: ./gradlew build
