spring.application.name=api

# Local settings and secrets from apps/api/.env (git-ignored). See .env.example.
spring.config.import=optional:file:.env[.properties]

# Database: DB_* from .env, or the local docker-compose database when unset.
# Tests use their own Testcontainers database and ignore these.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/nimbus}
spring.datasource.username=${DB_USERNAME:nimbus}
spring.datasource.password=${DB_PASSWORD:nimbus}

# Sign-in: JWT_SECRET from .env is required (the app refuses to start without it).
# Tests generate their own random secret.
nimbus.auth.jwt-secret=${JWT_SECRET:}

# Rate limits key on the client's IP. Take it from X-Forwarded-For only when the request comes from a
# trusted proxy (Tomcat trusts private and loopback addresses), so internet clients can't fake it.
server.forward-headers-strategy=native

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# First admin User, created at startup when both are set (see .env.example). Does nothing if that email exists.
nimbus.admin.email=${NIMBUS_ADMIN_EMAIL:}
nimbus.admin.password=${NIMBUS_ADMIN_PASSWORD:}

# "Continue with Google": off unless GOOGLE_CLIENT_ID is set (see .env.example). Provider tokens are never stored.
nimbus.auth.google.client-id=${GOOGLE_CLIENT_ID:}
nimbus.auth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
# "Continue with GitHub": likewise off unless GITHUB_CLIENT_ID is set.
nimbus.auth.github.client-id=${GITHUB_CLIENT_ID:}
nimbus.auth.github.client-secret=${GITHUB_CLIENT_SECRET:}
# Only the OAuth handshake uses an HTTP session; it is dropped when the handshake ends. Lax, so the cookie
# comes back with Google's redirect.
server.servlet.session.timeout=5m
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true

# The origin browsers use to reach Nimbus (PUBLIC_URL in .env or the environment). Providers redirect back to it.
# In dev that is the Vite server, which proxies /api to this API.
nimbus.auth.public-url=${PUBLIC_URL:http://localhost:3000}

# Email goes through Brevo when BREVO_API_KEY is set (MAIL_FROM is then required); otherwise it is written to the log.
nimbus.mail.brevo-api-key=${BREVO_API_KEY:}
nimbus.mail.from=${MAIL_FROM:}
nimbus.mail.from-name=${MAIL_FROM_NAME:Nimbus}
