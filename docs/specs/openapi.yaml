openapi: 3.1.0
info:
  title: Nimbus API
  version: 0.1.0
  description: "REST contract for Nimbus. Every endpoint needs a Bearer access token unless it says `security: []`."

servers:
  - url: /

security:
  - bearerAuth: []

tags:
  - name: projects
    description: Projects and project membership
  - name: auth
    description: Registration, sign-in and sessions (identity module)
  - name: users
    description: User profiles (identity module)
  - name: access
    description: Permissions, Roles and Role assignments (access module)
  - name: notifications
    description: The signed-in User's Notification inbox

paths:
  /api/projects:
    post:
      tags: [projects]
      summary: Create a project and become its first Member
      description: Requires a verified email. The project and membership are saved together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Email not verified (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: Project key is already taken, including by an Archived project; errors.key explains the conflict
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{key}:
    get:
      tags: [projects]
      summary: Open a project the User is a Member of
      parameters:
        - name: key
          in: path
          required: true
          description: Project key, matched case-insensitively
          schema:
            type: string
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Email not verified (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Project not found (also returned for a non-Member)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/notifications:
    get:
      tags: [notifications]
      summary: List the caller's Notifications, newest first
      description: >-
        Requires a verified User. Ordered by createdAt descending, then id descending.
        The cursor resumes after the last item, including when timestamps are equal.
        Display content is a stored snapshot; reading never looks up the current device or User.
      parameters:
        - in: query
          name: before
          description: Opaque nextCursor from the previous page
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The caller's Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "400":
          description: Invalid cursor or limit
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/notifications/unread-count:
    get:
      tags: [notifications]
      summary: Count the caller's unread Notifications
      responses:
        "200":
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count:
                    type: integer
                    format: int64
                    minimum: 0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/notifications/{id}/read:
    post:
      tags: [notifications]
      summary: Mark one of the caller's Notifications as read
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Marked read, including when already read
        "400":
          description: Invalid Notification id
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Notification does not exist or belongs to another User

  /api/notifications/read-all:
    post:
      tags: [notifications]
      summary: Mark all of the caller's Notifications as read
      responses:
        "204":
          description: All of the caller's Notifications are read
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/users/me/notification-settings:
    get:
      tags: [notifications]
      summary: The caller's email switches for Issue Notification types
      description: >-
        Requires a verified User. Always lists the five Issue types in a fixed order. Email defaults to on except for
        ISSUE_EDITED. In-app Notifications and Security alerts are always on and not listed.
      responses:
        "200":
          description: One entry per Issue type
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationSetting"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/users/me/notification-settings/{type}:
    put:
      tags: [notifications]
      summary: Switch email on or off for one Issue Notification type
      description: >-
        Requires a verified User. Only switches that differ from the default are stored; saving the default removes the
        stored switch. Security alert types and unknown types give 400.
      parameters:
        - in: path
          name: type
          required: true
          schema:
            $ref: "#/components/schemas/IssueNotificationType"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: boolean
      responses:
        "204":
          description: Saved
        "400":
          description: Unknown type, a Security alert type, or a missing email
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "Unverified User (code: email_unverified)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/register:
    post:
      tags: [auth]
      summary: Register with email and password, and sign in straight away
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created and signed in
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "409":
          description: The email is already registered
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/login:
    post:
      tags: [auth]
      summary: Sign in with email and password
      description: >-
        For a User with Two-step verification a right password starts no session: the answer is
        `{twoStepRequired: true}` with no token and no refresh cookie, and the `two_step_pending` cookie that
        `POST /api/auth/two-step` needs to finish the sign-in with a Sign-in code. A `two_step_remembered` cookie that
        remembers this User's browser (unexpired, see `POST /api/auth/two-step`) skips the code.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in, or (with Two-step verification) a Sign-in code is needed
          headers:
            Set-Cookie:
              description: >-
                The refresh cookie when signed in (see `RefreshCookie`); otherwise the pending cookie (see the
                `twoStepPendingCookie` scheme)
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthResponse"
                  - type: object
                    required: [twoStepRequired]
                    properties:
                      twoStepRequired:
                        type: boolean
                        const: true
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          description: Invalid email or password (the same for an unknown email, a wrong password and a User without a password)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/two-step:
    post:
      tags: [auth]
      summary: Finish a password sign-in with a Sign-in code or a Recovery code
      description: >-
        Checks a Sign-in code from the User's authenticator app, or one of their Recovery codes, for the pending
        sign-in in the `two_step_pending` cookie. One 30-second step either side of now is accepted, but never the step
        that last signed the User in or an older one. A Recovery code is compared with capitals, spaces and the dash
        ignored, works once, and publishes `RecoveryCodeUsed` when used. A right code starts the session as `POST /api/auth/login` does and ends the pending sign-in. A
        pending sign-in lasts 5 minutes and allows 5 wrong codes. A refresh never comes here. With
        `rememberBrowser: true` a right code also sets `two_step_remembered` (HttpOnly; Secure; SameSite=Lax;
        Path=/api; Max-Age 30 days): password and Google/GitHub sign-ins of this User on this browser skip the code for
        a fixed 30 days, until a password change or reset, Remove, or "Sign out all other devices" elsewhere.
      security:
        - twoStepPendingCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `nimbus`. Cross-site forms can't set it, so other sites can't use the cookie.
          schema:
            type: string
            const: nimbus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Either `code` or `recoveryCode`; with `recoveryCode`, `code` is ignored.
              properties:
                code:
                  type: string
                  maxLength: 64
                  example: "123456"
                recoveryCode:
                  type: string
                  maxLength: 64
                  example: k7qx-2m9d
                rememberBrowser:
                  type: boolean
                  default: false
                  description: Don't ask again on this device for 30 days.
      responses:
        "200":
          description: >-
            Signed in; the pending cookie is cleared, and with `rememberBrowser` the `two_step_remembered` cookie is
            set too
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: >-
            The code is wrong or isn't 6 digits, or the Recovery code is wrong or used already (`code: invalid_code`,
            with `triesLeft`), or either is over 64 characters (`errors.code`, `errors.recoveryCode`)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      triesLeft:
                        type: integer
        "401":
          description: >-
            `code: sign_in_expired`: the pending sign-in is missing, unknown, used or older than 5 minutes, or this was
            its 5th wrong code. Clears the pending cookie; the User signs in again.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The X-Requested-With header is missing or not `nimbus`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: >-
            The User got `nimbus.auth.wrong-sign-in-codes-per-hour` (default 10) codes wrong in the last hour, across
            sign-ins, setup and View new codes; every code check is refused until `Retry-After` seconds have passed
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/oauth2/google:
    get:
      tags: [auth]
      summary: Start "Continue with Google"
      description: >-
        Open it with a full page load (a link, not `fetch`): the browser is redirected to Google and back. The
        handshake keeps a short-lived HTTP session; nothing else in the API does. Only available when
        `GOOGLE_CLIENT_ID` is set.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReturnTo"
        - $ref: "#/components/parameters/LinkTicket"
      responses:
        "302":
          description: Redirect to Google's sign-in page

  /api/auth/oauth2/callback/google:
    get:
      tags: [auth]
      summary: Where Google sends the browser back to (not called by the web app)
      description: >-
        Signs the User in or creates them, linking the Google login (see the identity module spec for the rules).
        On success it sets the refresh cookie and redirects to `/auth/callback` on the public URL (`PUBLIC_URL`), where the web app calls
        `POST /api/auth/refresh` for an access token; no token is ever in a URL. A User with Two-step verification
        gets no session and no refresh cookie yet: the `two_step_pending` cookie and a redirect to `/login/two-step`,
        where `POST /api/auth/two-step` finishes the sign-in. A `returnTo` kept when the sign-in started is added to
        every redirect as `&returnTo=<page>` (or `?returnTo=`). On failure it redirects to
        `/login?error=<code>&provider=google` on the public URL with `email_unverified` (Google did not verify the email),
        `disconnected` (the User on that email disconnected Google), `cancelled` (the person declined at Google) or `failed` (anything else).
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from Google
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by Google instead of `code`, e.g. `access_denied`
          schema:
            type: string
      responses:
        "302":
          description: >-
            Redirect to `/auth/callback` (with the refresh cookie set), to `/login/two-step` (with the pending cookie
            set) or to `/login?error=<code>`
          headers:
            Set-Cookie:
              description: The refresh cookie (see `RefreshCookie`), or the pending cookie (see the `twoStepPendingCookie` scheme)
              schema:
                type: string

  /api/auth/oauth2/github:
    get:
      tags: [auth]
      summary: Start "Continue with GitHub"
      description: >-
        Open it with a full page load (a link, not `fetch`): the browser is redirected to GitHub and back. The
        handshake keeps a short-lived HTTP session; nothing else in the API does. Only available when
        `GITHUB_CLIENT_ID` is set.
      security: []
      parameters:
        - $ref: "#/components/parameters/ReturnTo"
        - $ref: "#/components/parameters/LinkTicket"
      responses:
        "302":
          description: Redirect to GitHub's sign-in page

  /api/auth/oauth2/callback/github:
    get:
      tags: [auth]
      summary: Where GitHub sends the browser back to (not called by the web app)
      description: >-
        Signs the User in or creates them, linking the GitHub login (see the identity module spec for the rules).
        On success it sets the refresh cookie and redirects to `/auth/callback` on the public URL (`PUBLIC_URL`), where the web app calls
        `POST /api/auth/refresh` for an access token; no token is ever in a URL. A User with Two-step verification
        gets no session and no refresh cookie yet: the `two_step_pending` cookie and a redirect to `/login/two-step`,
        where `POST /api/auth/two-step` finishes the sign-in. A `returnTo` kept when the sign-in started is added to
        every redirect as `&returnTo=<page>` (or `?returnTo=`). On failure it redirects to
        `/login?error=<code>&provider=github` on the public URL with `email_unverified` (the GitHub account has no verified primary email),
        `disconnected` (the User on that email disconnected GitHub), `cancelled` (the person declined at GitHub) or `failed` (anything else).
      security: []
      parameters:
        - name: code
          in: query
          description: Authorization code from GitHub
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
        - name: error
          in: query
          description: Set by GitHub instead of `code`, e.g. `access_denied`
          schema:
            type: string
      responses:
        "302":
          description: >-
            Redirect to `/auth/callback` (with the refresh cookie set), to `/login/two-step` (with the pending cookie
            set) or to `/login?error=<code>`
          headers:
            Set-Cookie:
              description: The refresh cookie (see `RefreshCookie`), or the pending cookie (see the `twoStepPendingCookie` scheme)
              schema:
                type: string

  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Renew the session from the refresh cookie and get a new access token
      description: >-
        Exchanges the refresh cookie for a new one (rotation). A refresh token works once: presenting a used one
        revokes its whole session.
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `nimbus`. Cross-site forms can't set it, so other sites can't use the cookie.
          schema:
            type: string
            const: nimbus
      responses:
        "200":
          description: Session renewed
          headers:
            Set-Cookie:
              $ref: "#/components/headers/RefreshCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: The cookie is missing, unknown, expired, revoked or already used
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: The X-Requested-With header is missing or not `nimbus`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Sign out of this browser
      description: >-
        Ends the session the refresh cookie belongs to, even if that token was already rotated, and clears the
        cookie. Other sessions of the same User are not affected. Succeeds with no cookie, an unknown cookie or
        a session that is already over.
      security:
        - refreshCookie: []
      parameters:
        - name: X-Requested-With
          in: header
          required: true
          description: Must be `nimbus`. Cross-site forms can't set it, so other sites can't sign a User out.
          schema:
            type: string
            const: nimbus
      responses:
        "204":
          description: Signed out; the refresh cookie is cleared (`Max-Age=0`)
          headers:
            Set-Cookie:
              description: "`refresh_token=; HttpOnly; Secure; SameSite=Strict; Path=/api/auth; Max-Age=0`"
              schema:
                type: string
        "403":
          description: The X-Requested-With header is missing or not `nimbus`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/verify-email:
    post:
      tags: [auth]
      summary: Verify the signed-in User's email with the code emailed to them
      description: >-
        Needs the access token of a signed-in User, who may be unverified (this is how they stop being). A right
        code marks the email verified, deletes the code and publishes `EmailVerified`. A User who is already
        verified gets `200` again. A wrong try is counted; the fifth wrong try cancels the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: The 6 digits from the email. Spaces are ignored.
      responses:
        "200":
          description: The User, now verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            The code is missing or malformed (`errors.code`), wrong (`code` is `invalid_code`, with `triesLeft`), or there is
            no live code (`code` is `code_expired`: expired, cancelled after 5 wrong tries, or never issued)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      triesLeft:
                        type: integer
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/auth/verify-email/resend:
    post:
      tags: [auth]
      summary: Email the signed-in User a new Verification code
      description: >-
        Needs the access token of a signed-in User, who may be unverified. Issues a new code, which replaces and
        cancels the old one, and emails it after commit. Emails to one address are at least 60 seconds apart and at
        most 5 an hour; the send at registration counts.
      responses:
        "204":
          description: A new code was issued and emailed
        "401":
          description: Not signed in
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The email is already verified
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many emails to this address; the live code is unchanged
          headers:
            Retry-After:
              description: Seconds until a send is allowed
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/password-reset:
    post:
      tags: [auth]
      summary: Email a Reset code to a User who forgot their password
      security: []
      description: >-
        Always `204`, whether or not a User has the email, so the answer never says who is registered. For a
        registered email (Users with no password included) a Reset code is issued, replacing any live one, and
        emailed. The lookup, the code and the send all happen after the response, and a failure is logged, never
        shown.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 254
                  description: Any case; surrounding whitespace is ignored
      responses:
        "204":
          description: Accepted. A code is on its way if the email is registered
        "400":
          $ref: "#/components/responses/InvalidFields"
        "429":
          description: >-
            This IP address asked too often, or the email was mailed too recently or too often (the shared send
            budget, spent for any email typed, registered or not). Nothing is sent and a live code is unchanged.
          headers:
            Retry-After:
              description: Seconds until another request may succeed
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/auth/password-reset/confirm:
    post:
      tags: [auth]
      summary: Set a new password with the Reset code from the email
      security: []
      description: >-
        A right code sets the password, deletes the code, marks the email verified (publishing `EmailVerified` if it
        wasn't), ends every session of the User and clears the failed sign-ins for the email. The User is not signed
        in. A wrong try is counted; the fifth cancels the code. An unknown email gets the same answer as an expired
        code. A new password that breaks the rule, or a malformed code, is refused without counting a try. A User with
        Two-step verification also needs `twoStepCode` (a Sign-in code) or `recoveryCode` (ADR 0005): only once the
        Reset code is right, a missing one answers `two_step_required` and a wrong one `invalid_two_step_code`, and
        either way nothing changes and the Reset code stays usable with its tries. A right Recovery code is used up and
        publishes `RecoveryCodeUsed`. Two-step verification stays on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code, newPassword]
              properties:
                email:
                  type: string
                  maxLength: 254
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: The 6 digits from the email. Spaces are ignored.
                newPassword:
                  type: string
                  minLength: 8
                  maxLength: 128
                twoStepCode:
                  type: string
                  maxLength: 64
                  description: >-
                    For a User with Two-step verification, a Sign-in code from their authenticator app; ignored when
                    `recoveryCode` is given, and for Users without Two-step verification.
                  example: "123456"
                recoveryCode:
                  type: string
                  maxLength: 64
                  description: >-
                    For a User with Two-step verification who lost their phone, one of their Recovery codes (capitals,
                    spaces and dashes ignored). A blank one counts as none.
                  example: k7qx-2m9d
      responses:
        "204":
          description: The password was changed; sign in with it
        "400":
          description: >-
            A field is invalid (`errors.newPassword`, `errors.code`, `errors.email`), the code is wrong (`code` is
            `invalid_code`, with `triesLeft`), or there is no live code for the email (`code` is `code_expired`:
            expired, cancelled after 5 wrong tries, never issued, or no User has the email). With a right Reset code, a
            User with Two-step verification gets `two_step_required` without a second code, or
            `invalid_two_step_code` for a wrong one (which counts toward the hourly lock on code checks)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      code:
                        type: string
                        enum: [invalid_code, code_expired, two_step_required, invalid_two_step_code]
                      triesLeft:
                        type: integer
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        "429":
          $ref: "#/components/responses/TooManyAttempts"

  /api/auth/providers:
    get:
      tags: [auth]
      summary: Which sign-in providers are enabled
      description: >-
        Public, no access token needed. The providers whose client id is set (`GOOGLE_CLIENT_ID`,
        `GITHUB_CLIENT_ID`), in the order to show them: `google`, then `github`. The web app shows "Continue with
        ..." only for these, and each listed provider has its `/api/auth/oauth2/<provider>` address.
      security: []
      responses:
        "200":
          description: The enabled providers; empty when none is set up
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                properties:
                  providers:
                    type: array
                    items:
                      type: string
                      enum: [google, github]
                example:
                  providers: [google, github]

  /api/users/me:
    get:
      tags: [users]
      summary: The signed-in User
      responses:
        "200":
          description: The signed-in User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [users]
      summary: Change the signed-in User's display name
      description: Only the display name can be changed here. Other properties in the body are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: The updated User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/users/me/password:
    put:
      tags: [users]
      summary: Set or change the signed-in User's password
      description: >-
        A User without a password (they only sign in with Google or GitHub) sets one; `currentPassword` is ignored.
        A User with one must give it as `currentPassword`. The request must come from a session that is still
        running. Changing an existing password ends every other session of the User; setting a first one ends none. This
        browser stays signed in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is set
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/users/me/confirm:
    post:
      tags: [users]
      summary: Confirm it's you, so an old sign-in can change the email
      description: >-
        The password and, for a User with Two-step verification, a Sign-in code or an unused Recovery code. A right
        answer lets this session change the email (`/api/users/me/email-change`) for the next
        `nimbus.auth.link-recent-sign-in` (default 10 minutes), as a fresh sign-in would. Connecting a provider and
        setting up Two-step verification still need a recent sign-in. The password is checked first, so a wrong one
        never says whether the User has Two-step verification. The session must be still running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  maxLength: 128
                twoStepCode:
                  type: string
                  description: The 6 digits from the authenticator app; only with Two-step verification.
                recoveryCode:
                  type: string
                  description: One of the User's Recovery codes, instead of `twoStepCode`.
      responses:
        "204":
          description: Confirmed
        "400":
          description: >-
            The password is wrong or missing (`errors.password`), or with Two-step verification the second code is
            missing (`code: two_step_required`) or wrong or used (`code: invalid_two_step_code`)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The User has no password (`code: no_password`): they sign in again instead"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/users/me/email-change:
    post:
      tags: [users]
      summary: Email a Verification code to the address the signed-in User wants as their email
      description: >-
        Starts an email change, or replaces the pending one and its code: a 6-digit code goes to the new address after
        commit, and the email changes only once it is entered (`/api/users/me/email-change/confirm`). Resend is the same
        call. The session must have started, or been confirmed (`/api/users/me/confirm`), within
        `nimbus.auth.link-recent-sign-in` (default 10 minutes) and be still running. Sends spend the new address's send budget (60 seconds apart, 5 an hour). A pending change doesn't hold
        the address. Unverified Users get `403 email_unverified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                  description: Surrounding whitespace is ignored; compared and stored lower-cased.
      responses:
        "204":
          description: A code was issued and emailed to the new address
        "400":
          description: >-
            The email is invalid (`errors.email`), or it is already the User's email (`code: same_email`)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not allowed: the sign-in is too old (`code: reauth_required`), or the User is Unverified
            (`code: email_unverified`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Another User has this email (`code: email_taken`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          description: Too many emails to this address; nothing is issued and a pending change is unchanged
          headers:
            Retry-After:
              description: Seconds until a send is allowed
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/me/email-change/confirm:
    post:
      tags: [users]
      summary: Change the signed-in User's email with the code emailed to the new address
      description: >-
        A right code changes the email to the pending address (it stays verified) and uses the code up. Sessions, the
        password, Two-step verification and Linked identities don't change. A wrong try is counted; the fifth cancels
        the change. The recent sign-in is not checked again. The session must be still running. Unverified Users get
        `403 email_unverified`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  pattern: "^[0-9]{6}$"
                  description: The 6 digits from the email. Spaces are ignored.
      responses:
        "200":
          description: The User, with the new email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            The code is missing or malformed (`errors.code`), wrong (`code` is `invalid_code`, with `triesLeft`), or no
            change is pending (`code` is `code_expired`: expired, cancelled after 5 wrong tries, or never asked for)
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Problem"
                  - type: object
                    properties:
                      triesLeft:
                        type: integer
                      errors:
                        type: object
                        additionalProperties:
                          type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            Another User took the address since the code was sent (`code: email_taken`); the email is unchanged and the
            code is not used up
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/me/profile-picture:
    put:
      tags: [users]
      summary: Upload the signed-in User's Profile picture
      description: >-
        Stores a JPEG, PNG or WebP of at most 5 MB as the User's uploaded photo, cropped to its centred square,
        resized to 256x256 and re-encoded as JPEG without metadata, and shows it. The photo gets a new address on
        every upload. Needs a running Session and a verified email. A User may upload 10 photos in an hour.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: The User, whose `avatarUrl` is now the uploaded photo's address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            The file is over 5 MB (`code: file_too_large`), isn't a JPEG, PNG or WebP (`code: unsupported_type`), or
            can't be read (`code: unreadable_image`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: 10 uploads in the last hour; `Retry-After` says how many seconds until another is allowed
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [users]
      summary: Remove the signed-in User's uploaded Profile picture
      description: >-
        Deletes the uploaded photo. If it was the picture shown, the User shows initials. Needs a running Session and a
        verified email.
      responses:
        "204":
          description: Removed, or there was no uploaded photo (nothing changes then)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/me/profile-picture/source:
    put:
      tags: [users]
      summary: Choose what the signed-in User's Profile picture shows
      description: Needs a running Session and a verified email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  type: string
                  enum: [uploaded, google, github, initials]
      responses:
        "200":
          description: The User, whose `avatarUrl` is the chosen picture's address (null for initials)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: >-
            The option isn't available: no uploaded photo, a provider that isn't connected or sent no picture, or any
            other word (`code: source_unavailable`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/profile-pictures/{key}:
    get:
      tags: [users]
      summary: An uploaded Profile picture
      description: >-
        Public, for `<img>` tags, which send no access token; keys are unguessable and change with every upload, so a
        response may be cached for a year.
      security: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The photo
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: No photo has this key
  /api/users/me/linked-identities:
    get:
      tags: [users]
      summary: The Google and GitHub accounts connected to the signed-in User
      description: >-
        The User's Linked identities, Google first and then GitHub. The request must come from a session that is still
        running. The provider's own id for the person is never returned.
      responses:
        "200":
          description: The Linked identities, empty when there are none
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LinkedIdentityInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/me/linked-identities/{provider}/link-ticket:
    post:
      tags: [users]
      summary: A one-time ticket for connecting Google or GitHub
      description: >-
        Returns a random ticket to pass as `link` on the full page load to `/api/auth/oauth2/{provider}`. It lasts 2
        minutes, works once and is bound to the session that asked, to the provider and to the browser: the answer sets the
        cookie `link_binder`, which must come back on the callback. The session must have started within
        `nimbus.auth.link-recent-sign-in` (default 10 minutes) and be still running.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "200":
          description: The ticket
          content:
            application/json:
              schema:
                type: object
                required: [ticket]
                properties:
                  ticket:
                    type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not allowed: the sign-in is too old (`code: reauth_required`), or the User is Unverified
            (`code: email_unverified`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Not a provider Nimbus knows, or one that is switched off
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "The User has a Linked identity for the provider already (`code: already_connected`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/me/linked-identities/{provider}:
    delete:
      tags: [users]
      summary: Disconnect Google or GitHub from the signed-in User
      description: >-
        Deletes the User's Linked identity for the provider and marks the provider as disconnected, so a later
        sign-in with it on the User's email is refused (`disconnected`) until it is connected again. Sessions are
        kept. No password is needed. The User is told by email afterwards. A provider that isn't linked also gives
        `204` and changes nothing. The request must come from a session that is still running.
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, github]
      responses:
        "204":
          description: The provider can no longer sign in as the User (or never could)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Not a provider Nimbus knows
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: >-
            The User has no password and this is their only Linked identity (`code: last_sign_in_method`). Set a
            password first.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/me/sessions:
    get:
      tags: [users]
      summary: The signed-in User's running sessions
      description: >-
        Every session of the User that can still be used: not signed out, before its 90-day cap, and used within the
        last 30 days. The session of this request comes first (`current`), the rest by `idleSeconds`, least first.
        The request must come from a session that is still running. The device is a label built from the browser's
        `User-Agent` ("Chrome on Windows", or "Unknown browser"); the header itself is never returned.
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/me/sessions/sign-out-others:
    post:
      tags: [users]
      summary: Sign out every other session of the signed-in User
      description: >-
        Ends every session of the User except the one of this request, without a password; their refresh tokens stop
        working. Their access tokens keep working for up to 15 minutes. Also `204` when there are no other sessions.
        Every remembered browser of the User asks for the Sign-in code again, except the one whose
        `two_step_remembered` cookie comes with this request. The request must come from a session that is still
        running.
      responses:
        "204":
          description: Every other session is over
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/users/me/sessions/{id}:
    delete:
      tags: [users]
      summary: Sign out one of the signed-in User's sessions
      description: >-
        Ends the session at once, without a password; its refresh tokens stop working. Its access tokens keep working
        for up to 15 minutes. Ending a session of the User that is already over also gives `204`, until the cleanup job deletes it (7 days after it ended). The request must come
        from a session that is still running.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The session is over
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: No session of the signed-in User has this id (unknown, not a UUID, or another User's)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/users/me/two-step:
    get:
      tags: [users]
      summary: Whether the signed-in User has Two-step verification
      description: The request must come from a session that is still running.
      responses:
        "200":
          description: Its state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TwoStepStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: Turn on Two-step verification
      description: >-
        Stores the setup the User just proved with `POST /api/users/me/two-step/setup/verify`: the authenticator key
        and the Recovery codes they were shown. Publishes `TwoStepEnabled`. Ends no session. The request must come from
        a session that is still running.
      responses:
        "204":
          description: Two-step verification is on
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            No proved setup in progress (`code: setup_expired`: never verified, closed, expired after 10 minutes, or
            restarted), or Two-step verification is on already (`code: already_on`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags: [users]
      summary: Remove Two-step verification
      description: >-
        Turns Two-step verification off after a Sign-in code from the User's authenticator app (one 30-second step
        either side of now, never a step already used) or one of their Recovery codes (capitals, spaces and dashes
        ignored). Deletes the authenticator key and every Recovery code, so a later setup starts fresh, and sign-ins
        stop asking for a code. Publishes `TwoStepDisabled`. Ends no session. The request must come from a session that
        is still running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A Recovery code, when given and not blank, is checked instead of the Sign-in code.
              properties:
                code:
                  type: string
                  maxLength: 64
                  example: "123456"
                recoveryCode:
                  type: string
                  maxLength: 64
                  example: k7qx-2m9d
      responses:
        "204":
          description: Two-step verification is off
        "400":
          description: >-
            The code is wrong, used already or isn't 6 digits, or the Recovery code is wrong or used (`code:
            invalid_code`, which counts toward the hourly lock), or a field is over 64 characters (`errors.code`,
            `errors.recoveryCode`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Two-step verification is not on (`code: not_on`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/users/me/two-step/setup:
    delete:
      tags: [users]
      summary: Throw away the setup in progress
      description: >-
        The User closed the setup window: this session's setup in progress, proved or not, is thrown away, so it can't
        be turned on later. The request must come from a session that is still running.
      responses:
        "204":
          description: Thrown away, or there was none
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [users]
      summary: Start setting up Two-step verification
      description: >-
        Makes a new authenticator key, replacing any setup in progress. Nothing is stored until the User turns it on;
        the setup lasts 10 minutes, in memory. The session must have started within `nimbus.auth.link-recent-sign-in`
        (default 10 minutes) and be still running.
      responses:
        "200":
          description: The key, for typing, and the address the QR code holds
          content:
            application/json:
              schema:
                type: object
                required: [key, otpauthUri]
                properties:
                  key:
                    type: string
                    description: Base32, 32 characters; the web app shows it in groups of four
                    example: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                  otpauthUri:
                    type: string
                    example: otpauth://totp/Nimbus:alice%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Nimbus
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: >-
            Not allowed: the sign-in is too old (`code: reauth_required`), or the User is Unverified
            (`code: email_unverified`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Two-step verification is on already (`code: already_on`), checked before the recent sign-in"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/me/two-step/setup/verify:
    post:
      tags: [users]
      summary: Prove the authenticator app has the key
      description: >-
        Checks a Sign-in code against the key being set up (one 30-second step either side of now is accepted) and
        answers with the 10 Recovery codes the User must save. A setup that is proved already answers with the same
        codes, so a second tab or a double click never replaces them. Only the session that started the setup can prove
        it, and 5 wrong codes throw it away. Wrong codes also count toward the User's hourly lock on Sign-in codes.
        Turns nothing on. The request must come from a session that is still running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: The Recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: string
                      pattern: "^[a-z0-9]{4}-[a-z0-9]{4}$"
                      example: k7qx-2m9d
        "400":
          description: >-
            The code doesn't fit the key or isn't 6 digits (`code: invalid_code`), or it is over 64 characters
            (`errors.code`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: >-
            No setup in progress for this session (`code: setup_expired`): never started, started by another session,
            expired, discarded, replaced, or thrown away by this, the 5th wrong code
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/users/me/two-step/recovery-codes:
    post:
      tags: [users]
      summary: View new codes
      description: >-
        Replaces the User's Recovery codes with a new set of 10, after a Sign-in code from their authenticator app (one
        30-second step either side of now, never a step already used; a Recovery code is not accepted). The old set
        stops working at once and the new codes are shown only in this answer. Publishes `RecoveryCodesRegenerated`.
        The request must come from a session that is still running.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 64
                  example: "123456"
      responses:
        "200":
          description: The new Recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                required: [recoveryCodes]
                properties:
                  recoveryCodes:
                    type: array
                    minItems: 10
                    maxItems: 10
                    items:
                      type: string
                      pattern: "^[a-z0-9]{4}-[a-z0-9]{4}$"
                      example: k7qx-2m9d
        "400":
          description: >-
            The code is wrong, used already or isn't 6 digits (`code: invalid_code`, which counts toward the hourly
            lock), or it is over 64 characters (`errors.code`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Two-step verification is not on (`code: not_on`)"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooManyAttempts"
  /api/access/permissions:
    get:
      tags: [access]
      summary: The Permission catalog
      description: >-
        Every Permission the modules declare, sorted by heading and key. Rebuilt from the code at every startup.
        Needs `access:role:manage`.
      responses:
        "200":
          description: The catalog
          content:
            application/json:
              schema:
                type: object
                required: [permissions]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: "#/components/schemas/CatalogPermission"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/access/roles:
    get:
      tags: [access]
      summary: Every Role
      description: Platform roles first, built-in Roles in their usual order, then the rest by name. Needs `access:role:manage`.
      responses:
        "200":
          description: The Roles
          content:
            application/json:
              schema:
                type: object
                required: [roles]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      summary: Create a custom Role
      description: It starts with no Grants. Its key and kind can never change. Needs `access:role:manage`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoleRequest"
      responses:
        "201":
          description: The new Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: A Role with this key already exists (also under `errors.key`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/access/roles/{key}:
    get:
      tags: [access]
      summary: One Role with its Grants
      description: Grants for Permissions no longer in the catalog are left out. Needs `access:role:manage`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [access]
      summary: Rename or redescribe a Role
      description: >-
        A missing name or description is left as it is. Sending `key` or `kind` is refused: they never change.
        Marks a built-in Role customised. Needs `access:role:manage`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeRoleRequest"
      responses:
        "200":
          description: The updated Role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"
    delete:
      tags: [access]
      summary: Delete a custom Role nobody holds
      description: Built-in Roles and Roles someone holds can't be deleted. Needs `access:role:manage`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"

  /api/access/roles/{key}/grants:
    put:
      tags: [access]
      summary: Replace all of a Role's Grants
      description: >-
        Each Grant must fit: a known Permission; in a project role a project permission with one of its allowed
        Scopes; in a platform role a platform permission without a Scope or a project permission with `all`; never a
        reserved Permission outside Platform admin; never twice. Marks a built-in Role customised. Needs
        `access:role:manage`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGrantsRequest"
      responses:
        "200":
          description: The Role with its new Grants
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "400":
          description: Some Grants don't fit; what is wrong per Permission key is under `errors`
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RoleConflict"

  /api/access/roles/{key}/reset:
    post:
      tags: [access]
      summary: Reset a built-in Role to its defaults
      description: >-
        Restores its name, description and Grants and clears `customised`. Refused for Platform admin and when the
        Role changed since the given version. Needs `access:role:manage`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: integer
                  description: The version the Role was opened at
      responses:
        "200":
          description: The Role, back to its defaults
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A custom Role (no defaults), Platform admin (locked), or the Role changed since the version
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/access/roles/{key}/users:
    parameters:
      - name: key
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [access]
      summary: Who holds a platform role
      description: >-
        Sorted by display name, then email. Everyone (held by every signed-in User) and project roles (given on a
        project's Members page) have no holders here. Needs `access:role:assign`.
      responses:
        "200":
          description: Its holders
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleHolder"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/NoHoldersHere"
    post:
      tags: [access]
      summary: Give a platform role to a User by email
      description: >-
        Finds the User by exact email (any case, surrounding whitespace ignored). Nobody gives themselves a Role.
        Recorded in the audit log. Needs `access:role:assign`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  maxLength: 320
      responses:
        "201":
          description: The new holder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleHolder"
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The User lacks `access:role:assign`, or the email is their own
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No Role has this key, or no User has this email
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: They already hold it, haven't verified their email (only Google or GitHub sign-in proves it), or it is Everyone or a project role
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/access/roles/{key}/users/{userId}:
    delete:
      tags: [access]
      summary: Take a platform role away from a User
      description: >-
        Nobody takes their own Role away, and Platform admin is never taken from its last holder: the check runs
        under a lock, so two admins removing each other at once can't both succeed. Recorded in the audit log. Needs
        `access:role:assign`.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Taken away
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The User lacks `access:role:assign`, or it is their own assignment
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: No Role has this key, or the User doesn't hold it
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The last Platform admin, or Everyone or a project role
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /api/access/audit:
    get:
      tags: [access]
      summary: The audit log, newest first
      description: >-
        Every change to Roles and their Grants, and startup warnings about the catalog. Entries are never edited
        or deleted. Needs `access:audit:view`.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: asOf
          in: query
          description: The `asOf` of the first page; keeps later pages from shifting as new entries arrive
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: One page of entries
          content:
            application/json:
              schema:
                type: object
                required: [entries, page, size, total, asOf]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEntry"
                  page:
                    type: integer
                  size:
                    type: integer
                  total:
                    type: integer
                  asOf:
                    type: integer
                    description: The newest entry these pages cover; pass it back for the next pages
        "400":
          $ref: "#/components/responses/InvalidFields"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/access/me/permissions:
    get:
      tags: [access]
      summary: What the signed-in User may do across Nimbus and in a project
      description: >-
        The signed-in User's platform permissions (from Everyone and their platform roles), sorted, so the web app
        can hide what they can't use. With `project`, also their widest Scope for each project permission they have
        in that project, from their project role there, their platform roles and Everyone. access doesn't know which
        projects exist, so any other id gets what platform roles and Everyone allow. The server checks every action
        anyway.
      parameters:
        - name: project
          in: query
          required: false
          description: The project's id (from `GET /api/projects/{key}`)
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Their platform permissions, and their Scopes in the project when one was given
          content:
            application/json:
              schema:
                type: object
                required: [platform]
                properties:
                  platform:
                    type: array
                    items:
                      type: string
                    example: [projects:project:create]
                  project:
                    type: object
                    description: >-
                      Only when `project` was given: project permission key to its widest Scope. Permissions the
                      User lacks there are left out.
                    additionalProperties:
                      type: string
                      enum: [own, project, all]
                    example:
                      projects:project:update: project
                      projects:member:manage: project
        "400":
          description: "`project` is not a UUID"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
    twoStepPendingCookie:
      type: apiKey
      in: cookie
      name: two_step_pending
      description: >-
        Set by `POST /api/auth/login` and the Google and GitHub callbacks for a User with Two-step verification: `two_step_pending=<random id>; HttpOnly;
        Secure; SameSite=Strict; Path=/api/auth/two-step; Max-Age=300`. Single use.

  parameters:
    LinkTicket:
      name: link
      in: query
      required: false
      description: >-
        A ticket from `POST /api/users/me/linked-identities/{provider}/link-ticket`. With it the handshake connects the
        provider account to that ticket's User instead of signing anyone in: no session, no refresh cookie. It ends at
        `/settings/security?connected=<provider>`, or `/settings/security?error=<code>&provider=<provider>` with
        `already_linked`, `already_connected`, `email_unverified`, `cancelled`, `failed` or `expired`.
      schema:
        type: string
    ReturnTo:
      name: returnTo
      in: query
      description: >-
        The page to land on after signing in, e.g. `/projects/42`. Kept in the handshake's session (never sent to the
        provider) and passed back as `returnTo` on the redirect that ends the handshake. Ignored unless it is a path
        inside the app: one leading `/`, not `/` alone, no control characters, at most 2048 characters.
      schema:
        type: string

  headers:
    RefreshCookie:
      description: >-
        Starts or rotates the session: `refresh_token=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/api/auth;
        Max-Age=<seconds until it expires>`. Expires 30 days after issue, and never later than 90 days after sign-in.
      schema:
        type: string

  schemas:
    CreateProjectRequest:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9]{1,9}$"
          description: Stored uppercase; cannot be changed or reused
        name:
          type: string
          description: Trimmed, 1–100 Unicode code points, no ISO control characters; need not be unique
        description:
          type: [string, "null"]
          maxLength: 1000
          description: Optional plain text; line breaks and tabs allowed, other control characters rejected
    Project:
      type: object
      required: [id, key, name, description, archived, createdAt]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name:
          type: string
        description:
          type: [string, "null"]
        archived:
          type: boolean
        createdAt:
          type: string
          format: date-time
    IssueNotificationType:
      type: string
      enum: [ISSUE_ASSIGNED, ISSUE_UNASSIGNED, ISSUE_STATUS_CHANGED, ISSUE_EDITED, ISSUE_DELETED]

    NotificationSetting:
      type: object
      required: [type, email]
      properties:
        type:
          $ref: "#/components/schemas/IssueNotificationType"
        email:
          type: boolean

    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        nextCursor:
          type: [string, "null"]
          description: Pass as before to fetch older Notifications; null at the end

    NotificationItem:
      type: object
      required: [id, type, createdAt, read, snapshot, link]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - SIGNED_IN
            - PASSWORD_CHANGED
            - LINKED_IDENTITY_CONNECTED
            - LINKED_IDENTITY_DISCONNECTED
            - OTHER_SESSIONS_SIGNED_OUT
        createdAt:
          type: string
          format: date-time
        read:
          type: boolean
        snapshot:
          type: object
          required: [title]
          properties:
            title:
              type: string
              example: New sign-in to your account
            deviceLabel:
              type: string
              description: Only for SIGNED_IN
              example: Safari on iPhone
            detail:
              type: string
              description: The line under the title for every other type
              example: If this wasn't you, reset it now.
        link:
          type: string
          const: /settings/security

    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Surrounding whitespace (no-break and other Unicode spaces included) is removed; at least one visible character; at most 100 characters (an emoji counts as one); no control, line-separator, private-use or invisible format characters (zero-width space, word joiner, byte order mark, soft hyphen), no bidirectional marks, overrides or isolates, and no combining grapheme joiner. U+200D and U+200C are allowed only between two visible characters (emoji sequences, Persian and Indic scripts). Tag characters are allowed only in a flag sequence, variation selectors only after emoji, keycaps and Han characters, and at most 5 combining marks may stack on one character
        email:
          type: string
          format: email
          maxLength: 254
          description: Case-insensitive; stored lower-cased
        password:
          type: string
          minLength: 8
          maxLength: 128

    UpdateProfileRequest:
      type: object
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Same rule as at registration. Surrounding whitespace (no-break and other Unicode spaces included) is removed; at least one visible character; at most 100 characters (an emoji counts as one); no control, line-separator, private-use or invisible format characters (zero-width space, word joiner, byte order mark, soft hyphen), no bidirectional marks, overrides or isolates, and no combining grapheme joiner. U+200D and U+200C are allowed only between two visible characters (emoji sequences, Persian and Indic scripts). Tag characters are allowed only in a flag sequence, variation selectors only after emoji, keycaps and Han characters, and at most 5 combining marks may stack on one character

    ChangePasswordRequest:
      type: object
      required: [newPassword]
      properties:
        currentPassword:
          type: string
          maxLength: 128
          description: Required when the User has a password (`400` with `errors.currentPassword` if missing or wrong)
        newPassword:
          type: string
          minLength: 8
          maxLength: 128
          description: Same rules as at registration; kept exactly as typed

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          description: Case-insensitive
        password:
          type: string

    AuthResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: HS256 JWT, valid 15 minutes. Keep it in memory only.
        user:
          $ref: "#/components/schemas/User"

    User:
      type: object
      required:
        [
          id,
          email,
          displayName,
          avatarUrl,
          hasPassword,
          emailVerified,
          passwordChangedAt,
          hasUploadedPicture,
          pictureSource,
          pictureOptions,
        ]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        avatarUrl:
          type: [string, "null"]
          format: uri-reference
          description: >-
            The Profile picture the User shows: their uploaded photo (by default an address under
            `/api/profile-pictures/`), or the picture their last Google or GitHub sign-in brought; null for initials
        hasPassword:
          type: boolean
          description: False for Users who only sign in with Google or GitHub; the app asks for a current password only when true
        emailVerified:
          type: boolean
          description: >-
            False until the User has entered the emailed code or signed in with Google or GitHub on the email.
            An Unverified User gets `403` with `code` `email_unverified` from every endpoint except
            `GET /api/users/me` and those under `/api/auth/`.
        passwordChangedAt:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the password was last set (sign-up, change, first password, forgot password). Null without a password,
            and for passwords set before Nimbus kept the time.
        hasUploadedPicture:
          type: boolean
          description: Whether the User has an uploaded photo, whether or not it is the picture shown
        pictureSource:
          type: [string, "null"]
          enum: [uploaded, google, github, initials, null]
          description: >-
            What the User shows. Null for a picture from before Linked identities kept their own, which belongs to none
            of the options.
        pictureOptions:
          type: object
          required: [uploadedAt, uploadedUrl, providers]
          description: What the User may pick from with `PUT /api/users/me/profile-picture/source`
          properties:
            uploadedAt:
              type: [string, "null"]
              format: date-time
            uploadedUrl:
              type: [string, "null"]
              format: uri-reference
              description: The uploaded photo's address, shown or not; null without an upload
            providers:
              type: array
              description: Each connected provider that sent a picture, Google first
              items:
                type: object
                required: [provider, pictureUrl, label]
                properties:
                  provider:
                    type: string
                    enum: [google, github]
                  pictureUrl:
                    type: string
                    format: uri
                  label:
                    type: string
                    description: The Google email or the GitHub username

    SessionInfo:
      type: object
      required: [id, device, current, startedAt, idleSeconds]
      properties:
        id:
          type: string
          format: uuid
        device:
          type: string
          description: Browser and system, e.g. "Chrome on Windows"; "Unknown browser" when the header was missing or not recognised
          example: Chrome on Windows
        current:
          type: boolean
          description: True for the session the request came from
        startedAt:
          type: string
          format: date-time
        idleSeconds:
          type: integer
          minimum: 0
          description: >-
            How many seconds ago this session last got a new refresh token, by the server's clock, so a wrong
            clock on the viewer's computer can't skew it. Accurate to about 15 minutes.

    LinkedIdentityInfo:
      type: object
      required: [provider, accountName, connectedAt]
      properties:
        provider:
          type: string
          enum: [google, github]
        accountName:
          type: [string, "null"]
          description: >-
            The Google email or the GitHub username, refreshed on every sign-in with that provider. Null for an
            identity linked before names were kept, until its next sign-in.
          example: udula@gmail.com
        connectedAt:
          type: string
          format: date-time

    TwoStepStatus:
      type: object
      required: [enabled, enabledAt, recoveryCodesLeft]
      properties:
        enabled:
          type: boolean
        enabledAt:
          type: [string, "null"]
          format: date-time
          description: When it was turned on; null when off
        recoveryCodesLeft:
          type: [integer, "null"]
          description: Recovery codes not used yet; null when off
          example: 10

    CatalogPermission:
      type: object
      required: [key, heading, description, kind, scopes, ownHint]
      properties:
        key:
          type: string
          description: "`module:resource:action`"
          example: projects:project:update
        heading:
          type: string
          description: The module heading the Roles page groups it under
          example: Projects
        description:
          type: string
        kind:
          type: string
          enum: [platform, project]
          description: >-
            A platform permission is granted in platform roles, without a Scope. A project permission is granted in
            project roles with one of `scopes`, and in platform roles only with `all`.
        scopes:
          type: array
          items:
            type: string
            enum: [own, project]
          description: The Scopes it may have in project roles; empty for platform permissions and for project permissions only platform roles hold
        ownHint:
          type: [string, "null"]
          description: What Scope Own means for it; null when Own isn't allowed
        reserved:
          type: boolean
          description: Only Platform admin may hold it

    RoleSummary:
      type: object
      required: [key, name, description, kind, builtIn, customised, permissions, holders]
      properties:
        key:
          type: string
          example: project_admin
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [platform, project]
        builtIn:
          type: boolean
        customised:
          type: boolean
          description: A built-in Role an admin changed; startup no longer resets it to the code defaults
        permissions:
          type: integer
          description: How many Permissions it grants
        holders:
          type: [integer, "null"]
          description: How many Role assignments it has; null for Everyone, which every signed-in User holds

    Role:
      type: object
      required:
        [
          key,
          name,
          description,
          kind,
          builtIn,
          customised,
          locked,
          version,
          grants,
          holders,
          newPermissions,
        ]
      properties:
        key:
          type: string
        name:
          type: string
        description:
          type: string
        kind:
          type: string
          enum: [platform, project]
        builtIn:
          type: boolean
        customised:
          type: boolean
        locked:
          type: boolean
          description: Nothing about it can be edited (Platform admin)
        version:
          type: integer
          description: Changes on every edit; edits must send the version they started from
        grants:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Grant"
              - type: object
                required: [locked]
                properties:
                  locked:
                    type: boolean
                    description: The Role must always hold it
        holders:
          type: [integer, "null"]
        newPermissions:
          type: array
          items:
            type: string
          description: For a customised built-in Role, its defaults it lacks that appeared after it was customised

    Grant:
      type: object
      required: [permission, scope]
      properties:
        permission:
          type: string
        scope:
          type: [string, "null"]
          enum: [own, project, all, null]
          description: Null for platform permissions

    RoleHolder:
      type: object
      description: A User holding a platform role
      required: [id, email, displayName, avatarUrl, since]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: [string, "null"]
          description: Null, like the name, for a User who no longer exists
        displayName:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        since:
          type: string
          format: date-time
          description: When they were given the Role

    AuditEntry:
      type: object
      required: [id, at, actor, action, target, before, after]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        actor:
          description: Who did it; null when the system did. Name and email are null for a User who no longer exists.
          oneOf:
            - type: "null"
            - type: object
              required: [id, displayName, email]
              properties:
                id:
                  type: string
                  format: uuid
                displayName:
                  type: [string, "null"]
                email:
                  type: [string, "null"]
        action:
          type: string
          enum:
            [
              role.created,
              role.renamed,
              role.described,
              role.grants_changed,
              role.reset,
              role.deleted,
              role.defaults_applied,
              role.locked_grants_restored,
              catalog.unknown_grant,
              catalog.unknown_grant_resolved,
            ]
        target:
          type: object
          required: [type, key, exists]
          properties:
            type:
              type: string
              enum: [role]
            key:
              type: string
            exists:
              type: boolean
              description: Whether the Role still exists
        before:
          type: [object, "null"]
          description: The state before the change; null when there was none
        after:
          type: [object, "null"]
          description: The state after the change; null when there is none

    CreateRoleRequest:
      type: object
      required: [key, name, kind]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9_]{1,49}$"
          description: Fixed forever
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Surrounding whitespace is removed first
        description:
          type: string
          maxLength: 500
        kind:
          type: string
          enum: [platform, project]
          description: Fixed forever

    DescribeRoleRequest:
      type: object
      required: [version]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
        version:
          type: integer
          description: The version the Role was opened at

    SaveGrantsRequest:
      type: object
      required: [grants, version]
      properties:
        grants:
          type: array
          items:
            $ref: "#/components/schemas/Grant"
        version:
          type: integer
          description: The version the Role was opened at

    Problem:
      type: object
      description: RFC 9457 problem details
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: >-
            A machine-readable reason where the status alone isn't enough, e.g. `email_unverified` (403),
            `invalid_code` or `code_expired` (400), `last_sign_in_method` or `already_connected` (409), `reauth_required` (403)

  responses:
    InvalidFields:
      description: Some fields are invalid
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  errors:
                    type: object
                    description: Message per invalid field
                    additionalProperties:
                      type: string
    TooManyAttempts:
      description: Rate limited (failed sign-ins per email or IP address, registrations, refreshes, forgot-password requests or reset attempts per IP address, wrong current passwords per User, or wrong Sign-in codes per User)
      headers:
        Retry-After:
          description: Seconds until another attempt may succeed
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: Missing, expired or invalid access token
    Forbidden:
      description: The User lacks the Permission this needs
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Nothing with this key exists
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RoleConflict:
      description: >-
        The Role changed since the given version, it is locked (Platform admin, or a Grant it must keep), it is
        built in (delete), or someone holds it (delete)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NoHoldersHere:
      description: Everyone (held by every signed-in User) or a project role (given on a project's Members page)
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
